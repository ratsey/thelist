# Kamatera deployment stub: `docker compose up -d --build` from this directory,
# with a .env holding SYNC_DOMAIN (deploy.sh writes it for you).
services:
  sync:
    build:
      context: ../../server
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/trolley-sync.db
    volumes:
      - sync-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - sync
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?set SYNC_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sync-data:
  caddy-data:
  caddy-config:
