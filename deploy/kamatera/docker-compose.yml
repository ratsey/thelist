# Kamatera deployment: the sync relay only. TLS and routing are handled by the
# existing Nginx on the host (AfPins), so no second reverse proxy is needed.
# The relay is published to loopback only; Nginx proxies the public subdomain to it.
services:
  sync:
    build:
      context: ../../server
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/thelist-sync.db
    volumes:
      - sync-data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  sync-data:
