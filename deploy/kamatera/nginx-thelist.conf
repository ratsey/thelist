# Nginx vhost for The List sync relay, co-hosted with AfPins on the same VPS.
# $SYNC_DOMAIN is substituted by deploy.sh. TLS is added by certbot.
server {
    listen 80;
    listen [::]:80;
    server_name $SYNC_DOMAIN;

    # Relay the sync API. Body limit matches the relay's own 1 MB cap.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
