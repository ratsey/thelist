name: Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      # Full history: the build number is the commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble and test
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thelist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  server:
    name: Sync server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protocol tests
        run: node --test server/test/

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the build number is the commit count, so a shallow clone would tag the
      # wrong version and phones would never see an update.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the computed version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR=$(grep -E '^appVersionMajor=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep -E '^appVersionMinor=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ]; then
            echo "::error::appVersionMajor and appVersionMinor are missing from gradle.properties"
            exit 1
          fi
          BUILD=$(git rev-list --count HEAD)
          NAME="$MAJOR.$MINOR.$BUILD"
          TAG="v$NAME"

          # The computed version is the source of truth; a pushed tag has to agree with it.
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the computed version $NAME (run ./scripts/bump-version.sh show). Push to main instead of tagging by hand."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.publish == 'true'

      - name: Require signing key
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing. In-app updates only work when every release is signed with the same key. Run scripts/generate-keystore.sh locally and add the four signing secrets."
            exit 1
          fi

      - name: Decode signing keystore
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: The List ${{ steps.version.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
