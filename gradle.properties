org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The only version number in the project. `versionCode` is derived from it
# (major*10000 + minor*100 + patch), so bumping is one edit:
#   ./scripts/bump-version.sh patch
# CI publishes a release whenever a push to main carries a version that has no
# release yet. Never lower or reuse a published version: installed phones
# compare versionName, and Android compares versionCode.
appVersionName=0.2.0

# Self-update source. Set these to your own GitHub repo; while the owner is the
# placeholder below the app silently skips update checks.
githubOwner=your-github-username
githubRepo=thelist

# Default sync relay shown in the share dialog. Empty means the app asks for it.
# Set this once deploy/kamatera is live, e.g. https://sync.example.com
syncServerUrl=
