org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The version is major.minor.build, and only the first two parts are set here:
#
#   appVersionMajor  deliberate — a big release        ./scripts/bump-version.sh major
#   appVersionMinor  deliberate — a feature release     ./scripts/bump-version.sh minor
#   build            automatic — the git commit count, so every committed change is already a
#                    new version and nobody has to remember to bump anything.
#
# versionCode is derived (major * 1000000 + minor * 10000 + build), so it always rises with the
# version and Android always accepts the update. Never lower a number that has shipped:
# installed phones compare versionName, Android compares versionCode.
appVersionMajor=0
appVersionMinor=3

# Only a fallback for builds with no usable git history (a source zip, a shallow clone that was
# never unshallowed). CI checks out with fetch-depth: 0, so it always uses the commit count.
appVersionBuild=0

# Self-update source. Set these to your own GitHub repo; while the owner is the
# placeholder below the app silently skips update checks.
githubOwner=ratsey
githubRepo=thelist

# Default sync relay shown in the share dialog. Empty means the app asks for it.
# Set this once deploy/kamatera is live, e.g. https://sync.example.com
syncServerUrl=https://thelist.ratsey.com
